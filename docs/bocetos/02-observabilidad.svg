<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="1280" height="840" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><text x="24" y="34" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start" style="white-space:pre">Boceto 2 · Panel de observabilidad (/observabilidad, solo administradores)</text><rect x="24" y="56" width="420" height="40" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="78" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">[ 24 h | 7 días | 30 días ]   ☑ incluir evaluación   ↻</text><rect x="24" y="112" width="260" height="176" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="134" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Latencia p95</text><text x="36" y="154" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="36" y="174" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  5,6 s</text><text x="36" y="194" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="36" y="214" font-size="15" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">p99 · máximo</text><rect x="300" y="112" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="312" y="134" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Ejecuciones</text><text x="312" y="152" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="540" y="112" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="552" y="134" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Mediana de latencia</text><text x="552" y="152" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="780" y="112" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="792" y="134" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tasa de error</text><text x="792" y="152" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="1020" y="112" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="1032" y="134" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Respuestas con respaldo</text><text x="1032" y="152" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="300" y="204" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="312" y="226" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Precios con respaldo</text><text x="312" y="244" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="540" y="204" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="552" y="226" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Llamadas a Gemini</text><text x="552" y="244" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="780" y="204" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="792" y="226" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tokens por ejecución</text><text x="792" y="244" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><rect x="1020" y="204" width="228" height="80" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="1032" y="226" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Intentos de inyección</text><text x="1032" y="244" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">  valor</text><text x="24" y="316" font-size="14" fill="#6b7280" font-weight="700" text-anchor="start" style="white-space:pre">Objetivos de servicio y alertas</text><rect x="24" y="328" width="296" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="350" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✓ Cumple / ✗ Alerta</text><text x="36" y="368" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">p95 ≤ 8 s · valor actual</text><rect x="334" y="328" width="296" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="346" y="350" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✓ Cumple / ✗ Alerta</text><text x="346" y="368" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">error ≤ 5 % · valor actual</text><rect x="644" y="328" width="296" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="656" y="350" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✓ Cumple / ✗ Alerta</text><text x="656" y="368" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">respaldo ≤ 20 % · valor actual</text><rect x="954" y="328" width="296" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="966" y="350" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✓ Cumple / ✗ Alerta</text><text x="966" y="368" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">precios ≥ 95 % · valor actual</text><rect x="24" y="420" width="610" height="200" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="442" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Ejecuciones en el tiempo (barras)</text><rect x="650" y="420" width="606" height="200" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="662" y="442" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Latencia p50 y p95 en el tiempo (líneas)</text><rect x="24" y="640" width="400" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="662" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Por flujo: agente / asistente /</text><text x="36" y="680" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">revisión de PC (n, p50, p95, error)</text><rect x="440" y="640" width="400" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="452" y="662" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Por herramienta y por etapa</text><text x="452" y="680" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">(llamadas, p95, errores)</text><rect x="856" y="640" width="400" height="150" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="868" y="662" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Cascada de una ejecución:</text><text x="868" y="680" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">entender → recomendar → guías →</text><text x="868" y="698" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">explicar (Gemini) en ms</text><text x="300" y="300" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">La métrica que manda (p95) va primero y más grande.</text><line x1="294" y1="296" x2="286" y2="296" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flecha)"/><text x="24" y="818" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Exportable a Prometheus/Grafana: GET /observability/prometheus</text></svg>
