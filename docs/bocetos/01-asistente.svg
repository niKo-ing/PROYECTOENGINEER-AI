<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><text x="24" y="34" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start" style="white-space:pre">Boceto 1 · Asistente (/chat): el razonamiento se pliega dentro de la respuesta</text><rect x="24" y="56" width="860" height="44" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="78" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Asistente de ahorro                                            [ Guardado (3) ]   [ Nueva conversación ]</text><rect x="560" y="120" width="300" height="40" rx="10" fill="#e5e7eb" stroke="#9ca3af"/><text x="572" y="142" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Quiero un notebook gamer, tengo $300.000</text><rect x="60" y="180" width="800" height="330" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="76" y="206" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start" style="white-space:pre">✦ Pensó en 7 pasos · cambió de plan 2 veces  ›</text><rect x="76" y="220" width="560" height="82" rx="10" fill="#fff" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="88" y="242" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">1. Buscó «notebook gamer» en el catálogo hasta $300.000</text><text x="88" y="259" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">2. Cambió de plan: no encontró resultados y amplió la búsqueda</text><text x="88" y="276" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">3. Revisó las ofertas…   ·   Ver detalle técnico</text><rect x="76" y="316" width="760" height="50" rx="10" fill="#fff" stroke="#9ca3af"/><text x="88" y="338" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Respuesta en texto: el más barato cuesta $349.990, faltan $49.990; dejé una alerta.</text><rect x="76" y="380" width="176" height="80" rx="10" fill="#fff" stroke="#9ca3af"/><text x="88" y="402" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tarjeta de producto 1</text><text x="88" y="419" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">precio · tienda</text><rect x="266" y="380" width="176" height="80" rx="10" fill="#fff" stroke="#9ca3af"/><text x="278" y="402" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tarjeta de producto 2</text><text x="278" y="419" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">precio · tienda</text><rect x="456" y="380" width="176" height="80" rx="10" fill="#fff" stroke="#9ca3af"/><text x="468" y="402" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tarjeta de producto 3</text><text x="468" y="419" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">precio · tienda</text><rect x="76" y="472" width="190" height="28" rx="14" fill="#dbeafe" stroke="#9ca3af"/><text x="88" y="494" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✓ Alerta creada · ver</text><rect x="60" y="640" width="800" height="52" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="72" y="662" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Escribe tu consulta…                                                                  [ Enviar ]</text><rect x="910" y="56" width="346" height="636" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="6 4"/><text x="922" y="78" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Detalle técnico (a pedido)</text><text x="922" y="96" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="922" y="114" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Plan con prioridades P1–P3</text><text x="922" y="132" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Herramientas y argumentos</text><text x="922" y="150" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Replanes y memoria usada</text><text x="910" y="712" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Panel lateral: solo se abre con «Ver detalle técnico».</text><text x="910" y="729" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Es lo que se muestra al docente: plan y trazas.</text><text x="652" y="236" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Plegado por defecto: el usuario</text><text x="652" y="253" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">ve la respuesta, no el registro.</text><line x1="646" y1="232" x2="640" y2="236" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flecha)"/><text x="280" y="492" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Lo escrito en la cuenta se confirma aquí;</text><text x="280" y="509" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">«Guardado» abre una ventana aparte.</text><line x1="274" y1="488" x2="268" y2="486" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flecha)"/></svg>
