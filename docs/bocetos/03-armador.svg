<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="DejaVu Sans, Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><defs><marker id="flecha" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker></defs><text x="24" y="34" font-size="20" fill="#1f2937" font-weight="700" text-anchor="start" style="white-space:pre">Boceto 3 · Armador de PC (/armar): la compatibilidad la decide el motor de reglas</text><rect x="24" y="56" width="1232" height="70" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="78" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Partir de una recomendación: [ uso ▾ ]   Presupuesto: [ 800000 ]   [ Armar por mí ]        [ Prefiero que la IA me pregunte ]</text><rect x="24" y="146" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="168" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Procesador</text><text x="36" y="185" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="212" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="234" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Placa madre</text><text x="36" y="251" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="278" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="300" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Memoria RAM</text><text x="36" y="317" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="344" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="366" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tarjeta gráfica</text><text x="36" y="383" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="410" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="432" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Almacenamiento</text><text x="36" y="449" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="476" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="498" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Fuente de poder</text><text x="36" y="515" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="542" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="564" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Gabinete</text><text x="36" y="581" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="24" y="608" width="230" height="56" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="36" y="630" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Refrigeración</text><text x="36" y="647" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">elegida / elegir</text><rect x="274" y="146" width="620" height="40" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="168" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Filtrar por modelo o marca…</text><rect x="274" y="200" width="620" height="76" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="222" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Pieza 1 · socket · núcleos · watts                          $precio</text><rect x="274" y="286" width="620" height="76" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="308" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Pieza 2 · socket · núcleos · watts                          $precio</text><rect x="274" y="372" width="620" height="76" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="394" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Pieza 3 · socket · núcleos · watts                          $precio</text><rect x="274" y="458" width="620" height="76" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="480" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Pieza 4 · socket · núcleos · watts                          $precio</text><rect x="274" y="544" width="620" height="76" rx="10" fill="#fff" stroke="#9ca3af"/><text x="286" y="566" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Pieza 5 · socket · núcleos · watts                          $precio</text><text x="286" y="583" font-size="12" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">✗ no calza: socket AM5 ≠ AM4</text><rect x="914" y="146" width="342" height="300" rx="10" fill="#f3f4f6" stroke="#9ca3af"/><text x="926" y="168" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Tu armado</text><text x="926" y="186" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="926" y="204" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">piezas elegidas · total</text><text x="926" y="222" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">vs presupuesto</text><text x="926" y="240" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="926" y="258" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">Reporte de compatibilidad:</text><text x="926" y="276" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">socket, memoria, medidas, watts</text><text x="926" y="294" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre"></text><text x="926" y="312" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start" style="white-space:pre">[ Guardar ]  [ Vaciar ]</text><text x="914" y="470" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">Cada opción dice si calza con lo ya</text><text x="914" y="487" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">elegido antes de comprar (regla, no LLM).</text><line x1="908" y1="466" x2="894" y2="560" stroke="#2563eb" stroke-width="1.5" marker-end="url(#flecha)"/><text x="914" y="530" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">«Prefiero que la IA me pregunte» lleva al</text><text x="914" y="547" font-size="12.5" fill="#2563eb" font-weight="400" text-anchor="start" style="white-space:pre">asistente de armado (Gemini entiende y explica).</text></svg>
