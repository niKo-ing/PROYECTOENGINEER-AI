# CD - Publica la imagen backend en GHCR y prepara (no ejecuta) el despliegue productivo.
#
# Se dispara SOLO con:
#   - push a la rama `main`
#   - creación de un tag `v*` (ej. v1.2.3)
#
# Los jobs de CI existentes (.github/workflows/backend.yml, frontend.yml) se
# conservan intactos. Este workflow revalida las mismas gates (tests, lint,
# build, imagen Docker) para que el deploy nunca se ejecute sobre cambios
# rotos, y publica la imagen de forma determinista con permisos mínimos.

name: CD - Publicar imagen y preparar despliegue

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── Validaciones previas (gate del despliegue) ─────────────────────────
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ejecutar tests
        env:
          PYTHONPATH: "."
        run: pytest -q

  frontend-check:
    name: Frontend lint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  # ── Construcción y publicación en GitHub Container Registry ─────────────
  build-and-publish:
    name: Build y publicar imagen backend (GHCR)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-check]
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Definir imagen GHCR (minúsculas requeridas)
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN: sin credenciales hardcodeadas en el repositorio.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Etiquetas: sha del commit, rama o tag, semver y `latest` (solo main).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Despliegue: seguro por defecto, nunca simulado ──────────────────────
  deploy:
    name: Deploy (requiere host y secretos productivos)
    runs-on: ubuntu-latest
    needs: build-and-publish
    # Serializa los despliegues: nunca dos en paralelo para el mismo flujo.
    concurrency:
      group: cd-deploy-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build-and-publish.outputs.image }}
      # Config del futuro host productivo (repository VARIABLES).
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - name: Autenticar en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verificar imagen publicada
        run: |
          set -euo pipefail
          image="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker manifest inspect "${image}" >/dev/null
          echo "Imagen verificada y publicada: ${image}"

      # Smoke test real sobre la imagen `sha-<commit>` (con SQLite local, sin
      # secretos): valida que /health responda "ok" antes de cualquier deploy.
      - name: Smoke test (health) con la imagen publicada
        run: |
          set -euo pipefail
          image="${IMAGE}:sha-${GITHUB_SHA::7}"
          cid="$(docker create -p 8090:8000 -e DATABASE_URL=sqlite:////tmp/cd-smoke.db "${image}")"
          docker start "${cid}"
          trap 'docker rm -f "${cid}" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            body="$(curl -sS -m 3 http://127.0.0.1:8090/health || true)"
            if printf '%s' "${body}" | grep -q '"status": *"ok"'; then
              echo "Health check OK"
              exit 0
            fi
            sleep 2
          done
          echo "Health check falló para ${image}:" >&2
          docker logs "${cid}" >&2 || true
          exit 1

      - name: Detectar configuración de despliegue
        id: cfg
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        # Los secretos se pasan por env (nunca se imprimen ni se interpolar en `if`).
        run: |
          ready=1
          [ -n "$DEPLOY_HOST" ] || ready=0
          [ -n "$DEPLOY_USER" ] || ready=0
          [ -n "$DEPLOY_PATH" ] || ready=0
          [ -n "$DEPLOY_SSH_KEY" ] || ready=0
          [ -n "$DATABASE_URL" ] || ready=0
          echo "ready=${ready}" >> "$GITHUB_OUTPUT"

      - name: Estado - despliegue productivo NO ejecutado (sin host)
        if: steps.cfg.outputs.ready != '1'
        env:
          HAS_DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
          HAS_SUPABASE_URL: ${{ secrets.SUPABASE_URL != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_LLM_PROVIDER: ${{ secrets.LLM_PROVIDER != '' }}
          HAS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          image="${IMAGE}:sha-${GITHUB_SHA::7}"
          {
            echo "### Despliegue productivo NO ejecutado"
            echo ""
            echo "La imagen \`${image}\` fue construida, publicada en GHCR y superó el smoke test de \`/health\`, pero el repositorio todavía **no tiene un host productivo configurado**. Este job no simula ni ejecuta un despliegue."
            echo ""
            echo "**Falta:**"
            for dep in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH; do
              [ -n "${!dep:-}" ] || echo "- Variable \`${dep}\`"
            done
            [ "$HAS_DEPLOY_SSH_KEY" = "true" ] || echo "- Secret \`DEPLOY_SSH_KEY\`"
            [ "$HAS_DATABASE_URL" = "true" ] || echo "- Secret \`DATABASE_URL\`"
            [ "$HAS_SUPABASE_URL" = "true" ] || echo "- Secret \`SUPABASE_URL\`"
            [ "$HAS_SUPABASE_ANON_KEY" = "true" ] || echo "- Secret \`SUPABASE_ANON_KEY\`"
            [ "$HAS_LLM_PROVIDER" = "true" ] || echo "- Secret \`LLM_PROVIDER\`"
            [ "$HAS_GEMINI_API_KEY" = "true" ] || echo "- Secret \`GEMINI_API_KEY\`"
            echo ""
            echo "Cuando estén completos, el job \`deploy\` installa la imagen en \`${DEPLOY_HOST:-\$DEPLOY_HOST}\`, corre \`alembic upgrade head\` y levanta el contenedor."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pipeline: CI + GHCR OK. DEPLOY productivo: pendiente de configuración."

      - name: Preparar llave SSH (sin imprimir secretos)
        if: steps.cfg.outputs.ready == '1'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

      - name: Preparar archivo de entorno remoto (sin imprimir secretos)
        if: steps.cfg.outputs.ready == '1'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          : > .deploy-env.local
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" >> .deploy-env.local
          printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL" >> .deploy-env.local
          printf 'SUPABASE_ANON_KEY=%s\n' "$SUPABASE_ANON_KEY" >> .deploy-env.local
          printf 'LLM_PROVIDER=%s\n' "$LLM_PROVIDER" >> .deploy-env.local
          printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> .deploy-env.local

      # Solo se ejecuta si las variables y secretos anteriores existen.
      # Flujo: pull de la imagen sha-<commit>, migraciones Alembic controladas,
      # start del contenedor y verificación de salud del host.
      - name: Desplegar en host (imagen + migraciones + health)
        if: steps.cfg.outputs.ready == '1'
        run: |
          set -euo pipefail
          image="${IMAGE}:sha-${GITHUB_SHA::7}"
          env_file="${DEPLOY_PATH}/.deploy-env.remote"
          scp -i "$HOME/.ssh/deploy_key" -o StrictHostKeyChecking=accept-new \
            .deploy-env.local "${DEPLOY_USER}@${DEPLOY_HOST}:${env_file}"
          rm -f .deploy-env.local
          ssh -i "$HOME/.ssh/deploy_key" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd '${DEPLOY_PATH}' && {
              docker pull '${image}'
              docker run --rm --env-file '${env_file}' '${image}' sh -c 'alembic upgrade head'
              docker rm -f todobarato-backend || true
              docker run -d --name todobarato-backend --restart unless-stopped \
                -p 8000:8000 --env-file '${env_file}' '${image}'
              rm -f '${env_file}'
            }"
          curl -sS --retry 30 --retry-delay 5 --retry-connrefused \
            "http://${DEPLOY_HOST}:8000/health" | grep -q '"status": *"ok"'
          echo "Despliegue completado en ${DEPLOY_HOST} con ${image}"