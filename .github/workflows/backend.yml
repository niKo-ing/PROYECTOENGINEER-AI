name: Backend CI

on:
  push:
    branches: [master, main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
  pull_request:
    branches: [master, main]
    paths:
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        env:
          PYTHONPATH: "."
        run: pytest -q
